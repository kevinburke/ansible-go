env:
  TZ: UTC
  STATICCHECK_VERSION: "v0.8.1"
  GOIMPORTS_VERSION: "v0.50.0"
  DIFFER_VERSION: "v1.4.0"
  ANSIBLE_VERSION: "2.21.4"

steps:
  - label: ":go: Format"
    key: "format"
    command: "bash .buildkite/ci.sh format"
    timeout_in_minutes: 10

  - label: ":go: Lint"
    key: "lint"
    command: "bash .buildkite/ci.sh lint"
    timeout_in_minutes: 10

  - label: ":lock: Check Versions"
    key: "check-versions"
    command: "bash .buildkite/ci.sh check-versions"
    timeout_in_minutes: 5

  - label: ":go: Test"
    key: "test"
    command: "bash .buildkite/ci.sh test"
    env:
      # Daemon startup and bridge tests bind real Unix sockets.
      CARACAL_BUILDKITE_ALLOW_UNIX_SOCKETS: "true"
    timeout_in_minutes: 15

  - label: ":go: Build"
    key: "build"
    command: "bash .buildkite/ci.sh build"
    timeout_in_minutes: 10

  - label: ":python: Test"
    key: "python-test"
    command: "bash .buildkite/ci.sh python-test"
    env:
      # Exercise the connection plugin's probe against a real daemon.
      CARACAL_BUILDKITE_ALLOW_UNIX_SOCKETS: "true"
    timeout_in_minutes: 15
